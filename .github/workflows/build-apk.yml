name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack Android project
        run: |
          unzip -q SelfDisciplineAndroid_MVP.zip
          cp patches/MainActivity.kt SelfDisciplineAndroid/app/src/main/java/com/sihan/selfdiscipline/MainActivity.kt
          cp patches/SelfDisciplineAccessibilityService.kt SelfDisciplineAndroid/app/src/main/java/com/sihan/selfdiscipline/SelfDisciplineAccessibilityService.kt
          cp patches/accessibility_service_config.xml SelfDisciplineAndroid/app/src/main/res/xml/accessibility_service_config.xml
          cd SelfDisciplineAndroid
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.10.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          python3 - <<'PY'
          p="app/build.gradle.kts"
          s=open(p,encoding="utf-8").read().replace('versionCode = 1','versionCode = 8').replace('versionCode = 2','versionCode = 8').replace('versionCode = 3','versionCode = 8').replace('versionCode = 4','versionCode = 8').replace('versionCode = 5','versionCode = 8').replace('versionCode = 6','versionCode = 8').replace('versionCode = 7','versionCode = 8').replace('versionName = "1.0.0"','versionName = "1.4.0"').replace('versionName = "1.1.0"','versionName = "1.4.0"').replace('versionName = "1.2.0"','versionName = "1.4.0"')
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: SelfDisciplineAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: SelfDiscipline-debug-apk-v2
          path: SelfDisciplineAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
