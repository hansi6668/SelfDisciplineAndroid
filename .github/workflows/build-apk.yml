name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack Android project
        run: |
          unzip -q SelfDisciplineAndroid_MVP.zip
          cd SelfDisciplineAndroid
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.10.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: SelfDisciplineAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: SelfDiscipline-debug-apk
          path: SelfDisciplineAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
